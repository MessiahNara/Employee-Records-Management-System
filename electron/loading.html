<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>HRMDO - EMIS</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f9fafb;
      color: #1f2937;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    .loader-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #e5e7eb;
      border-top: 4px solid #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 24px;
    }
    .title {
      font-size: 22px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 4px;
    }
    .status {
      font-size: 12px;
      color: #9ca3af;
      margin-top: 12px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loader-container">
    <div class="spinner"></div>
    <div class="title">Employee Records Management System</div>
    <div class="subtitle">Initializing services...</div>
    <div class="status" id="status">Starting application</div>
  </div>
  <script>
    var dots = 0;
    var statusEl = document.getElementById('status');
    setInterval(function() {
      dots = (dots + 1) % 4;
      var text = 'Starting application';
      for (var i = 0; i < dots; i++) text += '.';
      statusEl.textContent = text;
    }, 800);
  </script>
</body>
</html>
