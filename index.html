<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>HRMDO ERMS</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #f9fafb;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
      }
      #root {
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('error', function(e) {
        console.error('[Global Startup Error]', e.error || e.message);
        var root = document.getElementById('root');
        if (root && (!root.children || root.children.length === 0)) {
          root.innerHTML = '<div style="padding:40px;text-align:center;font-family:sans-serif;">' +
            '<h2 style="color:#ef4444;margin-bottom:12px;">Failed to Load Interface</h2>' +
            '<p style="color:#4b5563;max-width:520px;margin:0 auto 16px;">' + (e.message || 'An error occurred during application initialization.') + '</p>' +
            '<button onclick="localStorage.clear();sessionStorage.clear();location.href=\'#/login\';location.reload();" style="padding:10px 20px;background:#3b82f6;color:white;border:none;border-radius:6px;cursor:pointer;font-weight:600;">Reset Cache &amp; Load Login</button>' +
            '</div>';
        }
      });

      window.addEventListener('unhandledrejection', function(e) {
        console.error('[Global Unhandled Rejection]', e.reason);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
