<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>HRMDO ERMS</title>
    <style>
      /* Hide root until React renders to prevent source code flash */
      body {
        margin: 0;
        padding: 0;
        background-color: #f9fafb;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
      }
      #app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #f9fafb;
        z-index: 99999;
        transition: opacity 0.3s ease;
      }
      #app-splash .splash-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #e5e7eb;
        border-top: 3px solid #3b82f6;
        border-radius: 50%;
        animation: splash-spin 0.8s linear infinite;
      }
      #app-splash .splash-text {
        margin-top: 16px;
        color: #6b7280;
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.025em;
      }
      @keyframes splash-spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="app-splash">
      <div class="splash-spinner"></div>
      <div class="splash-text">Loading HRMDO ERMS...</div>
    </div>
    <div id="root"></div>
    <script>
      // Safety auto-dismiss for splash screen after 3.5s so it never freezes the window
      setTimeout(function() {
        var splash = document.getElementById('app-splash');
        if (splash && splash.style.opacity !== '0') {
          splash.style.opacity = '0';
          setTimeout(function() { if (splash.parentNode) splash.parentNode.removeChild(splash); }, 300);
        }
      }, 3500);

      // Catch and display any startup errors on screen with retry
      window.addEventListener('error', function(e) {
        var splashText = document.querySelector('#app-splash .splash-text');
        if (splashText) {
          splashText.innerHTML = '<span style="color:#ef4444;font-weight:600">Failed to load application:</span><br/><span style="font-size:12px;color:#4b5563">' + (e.message || 'Unknown error') + '</span><br/><button onclick="location.reload()" style="margin-top:10px;padding:6px 14px;background:#3b82f6;color:#fff;border:none;border-radius:6px;cursor:pointer;">Retry</button>';
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
